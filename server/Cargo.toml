[package]
name = "relay-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Relay server: framed JSON file/browse protocol over stdio (launched via ssh)."
license = "GPL-3.0-or-later"

[[bin]]
name = "relay-server"
path = "src/main.rs"

[dependencies]
serde_json = "1"
base64 = "0.22"
notify = "6"
libc = "0.2"

[profile.release]
opt-level = 2
